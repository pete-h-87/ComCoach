<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-label="ComCoach logo">
  <defs>
    <linearGradient id="bubbleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a7eea"/>
      <stop offset="100%" stop-color="#1e5bbf"/>
    </linearGradient>
  </defs>

  <!-- Speech bubble with brain-like wavy top: alternating arcs read as cortical lobes -->
  <path d="M 12 24
           C 12 18, 16 14, 22 16
           C 22 10, 28 8, 32 12
           C 36 8, 42 10, 42 16
           C 48 14, 52 18, 52 24
           C 56 26, 56 34, 52 36
           C 52 44, 46 48, 40 48
           L 26 48
           L 16 56
           L 18 48
           Q 12 46, 12 36
           C 8 34, 8 26, 12 24 Z"
        fill="url(#bubbleGrad)" stroke="#1a3a7d" stroke-width="1.5"/>

  <!-- Internal synapse network -->
  <line x1="22" y1="26" x2="40" y2="24" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="40" y1="24" x2="32" y2="38" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="22" y1="26" x2="32" y2="38" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.55" stroke-linecap="round"/>

  <circle cx="22" cy="26" r="2.5" fill="#ffffff"/>
  <circle cx="40" cy="24" r="2.5" fill="#ffffff"/>
  <circle cx="32" cy="38" r="2.8" fill="#ffffff"/>
</svg>
