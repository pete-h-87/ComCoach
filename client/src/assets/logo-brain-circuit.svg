<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-label="ComCoach logo">
  <!-- Brain silhouette: two-lobe shape -->
  <path d="M 32 8
           C 22 8, 16 14, 16 20
           C 9 22, 7 31, 13 35
           C 11 42, 18 47, 24 46
           C 25 52, 30 54, 32 51
           C 34 54, 39 52, 40 46
           C 46 47, 53 42, 51 35
           C 57 31, 55 22, 48 20
           C 48 14, 42 8, 32 8 Z"
        fill="#f4f6fa" stroke="#2a6fdb" stroke-width="2"/>

  <!-- Central groove between hemispheres -->
  <path d="M 32 8 Q 30 28, 32 51" stroke="#2a6fdb" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Circuit traces, left hemisphere -->
  <path d="M 14 24 L 22 24 L 22 30 L 28 30" stroke="#2a6fdb" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 14 38 L 20 38 L 20 44" stroke="#2a6fdb" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Circuit traces, right hemisphere -->
  <path d="M 50 24 L 42 24 L 42 30 L 36 30" stroke="#2a6fdb" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 50 38 L 44 38 L 44 44" stroke="#2a6fdb" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Circuit nodes -->
  <circle cx="14" cy="24" r="1.8" fill="#06a77d"/>
  <circle cx="14" cy="38" r="1.8" fill="#06a77d"/>
  <circle cx="50" cy="24" r="1.8" fill="#06a77d"/>
  <circle cx="50" cy="38" r="1.8" fill="#06a77d"/>
  <circle cx="28" cy="30" r="1.5" fill="#2a6fdb"/>
  <circle cx="36" cy="30" r="1.5" fill="#2a6fdb"/>
  <circle cx="20" cy="44" r="1.5" fill="#2a6fdb"/>
  <circle cx="44" cy="44" r="1.5" fill="#2a6fdb"/>
</svg>
